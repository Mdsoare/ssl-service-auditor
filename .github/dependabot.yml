version: 2
updates:
  # Monitora apenas GitHub Actions com proteção contra versões major inválidas
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build(deps-dev)"
      include: "scope"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      actions-dependencies:
        patterns:
          - "*"
