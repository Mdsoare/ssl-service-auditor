name: DevSecOps Unified Security Scan

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  # -------------------------------------------------------------
  # JOB 1: Detecção de Segredos e Credenciais Vazadas (TruffleHog)
  # -------------------------------------------------------------
  secret-scanning:
    name: Secret Scan (TruffleHog)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Scan para detecção de segredos
        uses: trufflesecurity/trufflehog@bcfcf73aaf4759d4dadc2783177c245a02792318

  # -------------------------------------------------------------
  # JOB 2: Detecção de Segredos (Gitleaks)
  # -------------------------------------------------------------
  secret-scanning-gitleaks:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Gitleaks / Secret Scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # -------------------------------------------------------------
  # JOB 3: Qualidade de Sintaxe Docs (Markdown)
  # -------------------------------------------------------------
  markdown-lint:
    name: Lint Markdown Docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Lint Markdown Files
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff
        with:
          globs: "**/*.md"

  # -------------------------------------------------------------
  # JOB 4: Qualidade de Código e Linters (ShellScript)
  # -------------------------------------------------------------
  sast-shellcheck:
    name: SAST (ShellCheck)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Executar ShellCheck (ShellScript)
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38
        with:
          ignore_paths: ".cache .venv build dist artifacts"

  # -------------------------------------------------------------
  # JOB 5: Análise Completa PSScriptAnalyzer (Estilo, SAST e Segurança)
  # -------------------------------------------------------------
  powershell-analysis:
    name: PowerShell Quality & Security Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Executar Análise Unificada PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository -Name 'PSGallery' -InstallationPolicy Trusted
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
          
          $totalErrors = 0

          # 1. Validação de Estilo e Formatação
          Write-Host "🔍 Executando verificações de estilo e formatação..." -ForegroundColor Cyan
          $styleRules = @('PSAvoidTrailingWhitespace', 'PSAvoidUsingCmdletAliases')
          $styleResults = @(Invoke-ScriptAnalyzer -Path ./ -Recurse -IncludeRule $styleRules)
          if ($styleResults.Count -gt 0) {
              $styleResults | Select-Object ScriptName, Line, Message, RuleName | Format-List
              Write-Error "Encontradas $($styleResults.Count) inconsistências de estilo/formatação."
              $totalErrors += $styleResults.Count
          }

          # 2. SAST Geral (Severidade Warning e Error)
          Write-Host "🔍 Executando SAST geral (Warning/Error)..." -ForegroundColor Cyan
          $sastResults = @(Invoke-ScriptAnalyzer -Path ./ -Recurse -Severity Warning, Error)
          if ($sastResults.Count -gt 0) {
              $sastResults | Select-Object ScriptName, Line, Message, RuleName | Format-List
              Write-Error "Foram encontradas $($sastResults.Count) inconformidades gerais."
              $totalErrors += $sastResults.Count
          }

          # 3. SAST Especializado em Segurança
          Write-Host "🔍 Executando regras avançadas de segurança..." -ForegroundColor Cyan
          $secRules = @(
            'PSAvoidUsingInvokeExpression',
            'PSAvoidUsingPlainTextForPassword',
            'PSAvoidUsingWMIC'
          )
          $secResults = @(Invoke-ScriptAnalyzer -Path ./ -Recurse -IncludeRule $secRules)
          if ($secResults.Count -gt 0) {
              $secResults | Select-Object ScriptName, Line, Message, RuleName | Format-List
              Write-Error "Encontradas vulnerabilidades de código de alta severidade!"
              $totalErrors += $secResults.Count
          }

          # Encerra o job se houver qualquer falha nas etapas acima
          if ($totalErrors -gt 0) {
              exit 1
          } else {
              Write-Host "✨ Todas as análises do PowerShell passaram com sucesso!" -ForegroundColor Green
          }

  # -------------------------------------------------------------
  # JOB 6: SAST Open Source com Horusec
  # -------------------------------------------------------------
  sast-horusec:
    name: SAST (Horusec)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Run Horusec Security Scan
        run: |
          curl -fsSL https://raw.githubusercontent.com/ZupIT/horusec/main/deployments/scripts/install.sh -o install_horusec.sh
          bash install_horusec.sh latest
          rm -f install_horusec.sh
          horusec start -p="./" --config-file-path="./.horusec-config.json" -D -I -e="false" -o="sarif" -O="./horusec-results.sarif" || true

      - name: Tratar e Validar SARIF do Horusec
        id: check_sarif
        if: always()
        run: |
          if [ -f "./horusec-results.sarif" ] && grep -q '"results": \[.\+\]' ./horusec-results.sarif; then
            echo "has_results=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️ Horusec não encontrou vulnerabilidades ou o arquivo SARIF está vazio."
            echo "has_results=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload Horusec SARIF report
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28
        if: always() && steps.check_sarif.outputs.has_results == 'true'
        with:
          sarif_file: horusec-results.sarif
          category: Horusec

  # -------------------------------------------------------------
  # JOB 7: SAST baseado em Regras com Semgrep
  # -------------------------------------------------------------
  sast-semgrep:
    name: SAST (Semgrep Scan)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      - name: Instalar Semgrep
        run: pip install --no-cache-dir semgrep

      - name: Executar Semgrep Scan
        run: |
          semgrep scan \
            --config=p/bash \
            --sarif \
            --output=semgrep.sarif \
            . || true

      - name: Tratar e Validar SARIF do Semgrep
        id: check_sarif
        if: always()
        run: |
          if [ -f "semgrep.sarif" ] && grep -q '"results": \[.\+\]' semgrep.sarif; then
            echo "has_results=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️ Semgrep não encontrou vulnerabilidades ou o arquivo SARIF está vazio."
            echo "has_results=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload do Relatório SARIF do Semgrep
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28
        if: always() && steps.check_sarif.outputs.has_results == 'true'
        with:
          sarif_file: semgrep.sarif
          category: Semgrep

  # -------------------------------------------------------------
  # JOB 8: Análise de Dependências Multilinguagem com OSV-Scanner
  # -------------------------------------------------------------
  sca-osv:
    name: SCA (OSV-Scanner)
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@6e4298ebc4db23e847df9b2e2de2939d6f066c67
    with:
      scan-args: "--allow-no-lockfiles --recursive ./"

  # -------------------------------------------------------------
  # JOB 9: Análise de Dependências e Misconfigurations com Trivy
  # -------------------------------------------------------------
  sca-trivy:
    name: SCA & Misconfig (Trivy Scan)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Executar Varredura Trivy (Repository)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"

      - name: Upload do Relatório SARIF do Trivy
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28
        if: always()
        with:
          sarif_file: "trivy-results.sarif"

  # -------------------------------------------------------------
  # JOB 10: Auditoria Nativa de Dependências (PowerShell)
  # -------------------------------------------------------------
  sca-powershell-modules:
    name: SCA (PowerShell Module & Repository Audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Auditar Repositórios e Módulos Importados
        shell: pwsh
        run: |
          $psd1Files = Get-ChildItem -Path . -Recurse -Filter *.psd1
          foreach ($file in $psd1Files) {
              $manifest = Import-PowerShellDataFile -Path $file.FullName
              if ($manifest.RequiredModules) {
                  Write-Host "Módulos requeridos em $($file.Name):"
                  $manifest.RequiredModules | Format-Table
              }
          }
          Write-Host "✅ Auditoria de manifestos PowerShell concluída."

  # -------------------------------------------------------------
  # JOB 11: Validação de Integridade Estrutural do Projeto PowerShell
  # -------------------------------------------------------------
  powershell-structure-check:
    name: Validate PowerShell Structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Validar arquivos essenciais do ecossistema PowerShell
        shell: pwsh
        run: |
          $ps1Files = Get-ChildItem -Path . -Recurse -Filter *.ps1
          $psd1Files = Get-ChildItem -Path . -Recurse -Filter *.psd1

          if ($ps1Files.Count -eq 0 -and $psd1Files.Count -eq 0) {
              Write-Error "❌ ERRO: Nenhum script (.ps1) ou manifesto (.psd1) foi encontrado!"
              exit 1
          }

          if (-not (Test-Path "README.md")) {
              Write-Error "❌ README.md não encontrado!"
              exit 1
          }

          Write-Host "✅ Estrutura básica do repositório PowerShell validada."

  # -------------------------------------------------------------
  # JOB 12: Build e Agrupamento dos Artefatos
  # -------------------------------------------------------------
  build-artifact:
    name: Bundle & Upload Artifact
    needs:
      [
        secret-scanning,
        secret-scanning-gitleaks,
        markdown-lint,
        sast-shellcheck,
        powershell-analysis,
        sast-horusec,
        sast-semgrep,
        sca-osv,
        sca-trivy,
        sca-powershell-modules,
        project-structure-check,
      ]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Gerar pacote de artefatos
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path build_artifact -Force
          if (Test-Path "scripts") {
              Copy-Item -Path "scripts" -Destination "build_artifact/" -Recurse -Force
          }
          if (Test-Path "README.md") {
              Copy-Item -Path "README.md" -Destination "build_artifact/" -Force
          }

      - name: Subir Artefato de Build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: project-build-artifact
          path: build_artifact/
          retention-days: 7
          if-no-files-found: warn
